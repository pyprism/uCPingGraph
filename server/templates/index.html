<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .htmlTitle }}</title>
    <link rel="icon" href="/static/favicon/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/static/favicon/apple-touch-icon.png">
    <link rel="manifest" href="/static/favicon/site.webmanifest">
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<div class="bg-grid"></div>
<main class="container">
    <header class="hero">
        <div>
            <p class="eyebrow">Network Telemetry</p>
            <h1>uCPingGraph</h1>
            <p class="subtitle">Track latency and packet loss in real time using ESP8266 and ESP32 devices.</p>
        </div>
        <div class="status-pill" id="last-updated">Waiting for data</div>
    </header>

    <section class="panel controls">
        <div class="field">
            <label for="network">Network</label>
            <select id="network"></select>
        </div>
        <div class="field">
            <label for="device">Device</label>
            <select id="device"></select>
        </div>
        <div class="field range-field">
            <label for="minutes">Window</label>
            <div class="window-presets" id="window-presets">
                <button type="button" data-minutes="15">15m</button>
                <button type="button" data-minutes="60" class="active">1h</button>
                <button type="button" data-minutes="360">6h</button>
                <button type="button" data-minutes="1440">24h</button>
                <button type="button" data-minutes="10080">7d</button>
            </div>
            <input type="range" id="minutes" min="1" max="10080" value="60">
            <span id="minutes-label">60 minutes</span>
        </div>
    </section>

    <section class="summary-grid">
        <article class="panel metric-card">
            <h2>Latest Latency</h2>
            <p id="latest-latency">- ms</p>
        </article>
        <article class="panel metric-card">
            <h2>Avg Latency</h2>
            <p id="avg-latency">- ms</p>
        </article>
        <article class="panel metric-card">
            <h2>Avg Packet Loss</h2>
            <p id="avg-packet-loss">- %</p>
        </article>
        <article class="panel metric-card">
            <h2>Availability</h2>
            <p id="availability">- %</p>
        </article>
    </section>

    <section class="panel chart-panel">
        <div class="panel-head">
            <h2>Latency and Packet Loss</h2>
            <button id="refresh" type="button">Refresh</button>
        </div>
        <div id="feedback" class="feedback"></div>
        <div id="chart"></div>
    </section>

    <footer class="site-footer">
        <a href="https://github.com/pyprism/uCPingGraph/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
            </svg>
            <span>github.com/pyprism/uCPingGraph</span>
        </a>
    </footer>
</main>

<script src="/static/echarts.min.js"></script>
<script src="/static/custom.js"></script>
</body>
</html>
